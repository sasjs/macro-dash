name: CI, Release & Deploy to GitHub Pages

# Macro Dash is fully playable backend-free: with no SAS server configured,
# the game degrades to localStorage mode.  So the Pages build is just the
# static src/ folder - plus src/sasjs.js, which is gitignored and regenerated
# by `npm ci` (the `prepare` script copies it from @sasjs/adapter).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # regenerates src/sasjs.js via the prepare script
      - run: npm ci

      # physics / level sanity gate
      - run: npm test

      - name: Inject version
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const version = pkg.version;
          const indexPath = 'src/index.html';
          let html = fs.readFileSync(indexPath,'utf8');
          html = html.replace('{{VERSION}}', version);
          fs.writeFileSync(indexPath, html);
          EOF

      # ensure Jekyll is disabled for GitHub Pages
      - name: Add .nojekyll
        run: touch src/.nojekyll

      # create GitHub release if on main branch
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ fromJSON("$(cat package.json)").version }}
          name: Release v${{ fromJSON("$(cat package.json)").version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - id: deployment
        uses: actions/deploy-pages@v4
