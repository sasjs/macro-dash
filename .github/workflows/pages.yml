name: Deploy to GitHub Pages

# Macro Dash is fully playable backend-free: with no SAS server configured,
# the game degrades to localStorage mode.  So the Pages build is just the
# static src/ folder - plus src/sasjs.js, which is gitignored and regenerated
# by `npm ci` (the `prepare` script copies it from @sasjs/adapter).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # regenerates src/sasjs.js via the prepare script
      - run: npm ci

      # physics / level sanity gate
      - run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - id: deployment
        uses: actions/deploy-pages@v4
