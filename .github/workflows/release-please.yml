name: Release

# release-please keeps one pull request open with the next version and the
# changelog, worked out from the conventional commits merged since the last
# tag. Merging that pull request is the release: it writes package.json and
# CHANGELOG.md, tags the commit, and publishes the GitHub release. This
# workflow then attaches the deployable artefacts, so
# releases/latest/download/<file> keeps answering.

on:
  push:
    branches: [main]
  # a manual run opens or refreshes the release PR without waiting for a commit
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # bumps package.json and CHANGELOG.md, and tags vX.Y.Z
          release-type: node

  artefacts:
    name: Build artefacts
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/artefacts.yml

  attach:
    name: Attach the artefacts to the release
    needs: [release, artefacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artefacts.outputs.artifact-name }}
          path: artefacts

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag_name }}" artefacts/* --clobber
