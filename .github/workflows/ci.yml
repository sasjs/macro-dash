name: CI – Test → Build → Pages

# Fully self-contained pipeline: runs entirely on the runner, builds the
# deployable artefacts with `sasjs cb` (no deploy step, no SAS/Viya
# server push), and tests the game in a real browser (headless chromium)
# against its own mocked build - a static site whose service worker answers
# /SASjsApi/* from @sasjs/api.  No SAS, no @sasjs/server, no devsetup.
# Releases are release-please's job (release-please.yml); this workflow tests,
# builds the artefacts, and deploys the site stamped with the version it finds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # pages: write / id-token: write are for the Pages deployment

concurrency:
  group: ci-macro-dash
  cancel-in-progress: true

jobs:
  test:
    name: Tests (browser automation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .npmrc carries ignore-scripts=true, so the adapter bundle is copied by
      # its own step rather than by the prepare script - and the dependency
      # gate runs on every build, refusing any advisory above the floor that is
      # not in scripts/audit-allowlist.json with a reason.
      - run: npm ci

      - name: Copy the adapter bundle (src/sasjs.js is gitignored)
        run: npm run adapter

      - name: Dependency audit gate
        run: npm run audit:gate

      # physics / level sanity gate
      - run: npm test

      # headless chromium for the Playwright suite.  Use the bundled
      # chromium (installed with --with-deps so shared libs are present)
      # - the documented, reliable path.
      - name: Install chromium (Playwright)
        # `--with-deps` installs system packages BEFORE it downloads the browser,
        # so the runner's apt mirror is a dependency of this job. A resolver
        # failure there ("Temporary failure resolving 'azure.archive.ubuntu.com'",
        # 2026-11-11) failed this step, skipped the suite and blocked the release,
        # for a reason no commit can affect and a re-run cannot fix while the
        # mirror is unreachable.
        #
        # The system packages are therefore best-effort and the browser is not;
        # the launch check below is what decides whether the image genuinely had
        # what Chromium needs.
        run: |
          npx playwright install --with-deps chromium ||
            npx playwright install chromium

      - name: Check chromium launches
        # Reading the install's exit code is not enough: a browser that installed
        # but cannot start fails every spec in the suite with a timeout, instead
        # of naming the missing library here.
        run: |
          node -e "
            const { chromium } = require('playwright')
            chromium
              .launch()
              .then((browser) => browser.close())
              .then(() => console.log('chromium launches'))
              .catch((error) => {
                console.error(error)
                process.exit(1)
              })
          "

      # The mock target builds a static site from the same services, under the
      # CLI this repo pins: a bump that drops the browser build fails here
      # rather than at the next person who tries it.  The suite under test is
      # this folder - run.js serves it and stops there.  No @sasjs/server, no
      # devsetup, no SAS: a backend that needs a binary to answer is exactly
      # what the mocked build exists to avoid.
      - name: Build the mock site
        run: npm run mock:build

      # what the pages job publishes is this folder, so check it is a site and
      # not just a copy of src/: the worker and its host are the backend there
      - name: Check the mock site has its backend
        run: |
          test -s sasjsbuild/mock/sw.js
          test -s sasjsbuild/mock/host/boot.js
          test -s sasjsbuild/mock/host/api-browser.js
          test -s sasjsbuild/mock/sasjs.js
          grep -q 'configured=' sasjsbuild/mock/index.html
          echo "mock site: worker + host + page"

      - name: Run browser e2e suite
        run: npm run test:e2e

  pages:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # the footer reads the newest tag as well as package.json, so the
          # tags have to be in the checkout
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # .npmrc sets ignore-scripts, so `prepare` does not run: the adapter
      # bundle that src/index.html loads has to be copied by this step
      - name: Copy the adapter bundle (src/sasjs.js is gitignored)
        run: npm run adapter

      # The footer states the version of the deployment. release-please writes
      # package.json when a release PR merges and tags the same commit, and on a
      # push the two arrive together - but not necessarily before this job reads
      # them, so the newer of the two wins.
      - name: Inject version
        run: |
          VERSION=$(node -e "
            const cur = require('./package.json').version;
            let tag = process.argv[1] || '';
            const p = (s) => String(s).replace(/^v/, '').split('.').map(Number);
            const newer = (a, b) => {
              const [a1, a2, a3] = p(a), [b1, b2, b3] = p(b);
              return (a1 - b1) || (a2 - b2) || (a3 - b3);
            };
            console.log(tag && newer(tag, cur) > 0 ? tag.replace(/^v/, '') : cur);
          " "$(git describe --tags --abbrev=0 2>/dev/null)")
          echo "footer version: $VERSION"
          export VERSION
          # replaces every {{VERSION}} placeholder in the page the build copies
          node - <<'EOF'
          const fs = require('fs');
          const version = process.env.VERSION;
          const indexPath = 'src/index.html';
          let html = fs.readFileSync(indexPath,'utf8');
          html = html.replaceAll('{{VERSION}}', version);
          fs.writeFileSync(indexPath, html);
          EOF
      # The published site is the *mocked* build, not src/: `sasjs build -t mock`
      # writes the same page plus host/ and sw.js, a service worker that answers
      # /SASjsApi/* from @sasjs/api.  A static host serves files only, so src/ on
      # its own has no backend and configure answers 405.
      - name: Build the mocked site
        run: npm run mock:build
      # The published folder is sasjsbuild/mock: the build copies src/ into it,
      # so the committed src/CNAME is the one place the domain is written.  Only
      # Jekyll's marker has to be added - src/ does not carry a hidden file.
      - name: Add .nojekyll
        run: touch sasjsbuild/mock/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sasjsbuild/mock
      - id: deployment
        uses: actions/deploy-pages@v4

  build:
    name: Build artefacts (sasjs cb)
    needs: test
    uses: ./.github/workflows/artefacts.yml
