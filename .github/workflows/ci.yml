name: CI – Test → Build → Release → Pages

# Fully self-contained pipeline: runs entirely on the runner, builds the
# deployable artefacts with `sasjs cb` (no deploy step, no SAS/Viya
# server push), tests the game in a real browser (headless chromium) against
# the local SASjs Server (whose JS mocks are the backend).  semantic-release
# runs before GitHub Pages so the homepage version matches the release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # needed for the release job (semantic-release writes a release + tags)

concurrency:
  group: ci-macro-dash
  cancel-in-progress: true

jobs:
  test:
    name: Tests (browser automation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # regenerates src/sasjs.js (prepare script copies the adapter UMD)
      - run: npm ci

      # physics / level sanity gate
      - run: npm test

      # the mock target builds a static site from the same services, under the
      # CLI this repo pins: a bump that drops the browser build fails here
      # rather than at the next person who tries it
      - name: Build the mock site
        run: npm run mock:build

      # headless chromium for the Playwright suite.  Use the bundled
      # chromium (installed with --with-deps so shared libs are present)
      # - the documented, reliable path.
      - name: Install chromium (Playwright)
        # `--with-deps` installs system packages BEFORE it downloads the browser,
        # so the runner's apt mirror is a dependency of this job. A resolver
        # failure there ("Temporary failure resolving 'azure.archive.ubuntu.com'",
        # 2026-11-11) failed this step, skipped the suite and blocked the release,
        # for a reason no commit can affect and a re-run cannot fix while the
        # mirror is unreachable.
        #
        # The system packages are therefore best-effort and the browser is not;
        # the launch check below is what decides whether the image genuinely had
        # what Chromium needs.
        run: |
          npx playwright install --with-deps chromium ||
            npx playwright install chromium

      - name: Check chromium launches
        # Reading the install's exit code is not enough: a browser that installed
        # but cannot start fails every spec in the suite with a timeout, instead
        # of naming the missing library here.
        run: |
          node -e "
            const { chromium } = require('playwright')
            chromium
              .launch()
              .then((browser) => browser.close())
              .then(() => console.log('chromium launches'))
              .catch((error) => {
                console.error(error)
                process.exit(1)
              })
          "

      # Cache the downloaded SASjs Server binary across runs.
      # devsetup is idempotent - the cache just avoids re-downloading it.
      #
      # The key names the RELEASE, not the script that downloads it: devsetup
      # fetches `releases/latest`, so hashing the script pins the cache to a
      # version nothing bumps, and the runner keeps starting a binary from
      # whenever the key was first used.
      #
      # What is cached is the BINARY, not the folder. tools/sasjs-server also
      # holds sasjs_root - the drive, the sessions, the settings the mock
      # configure service writes - and restoring that state is what makes the
      # next run's configure answer "No webout was returned": the step passes
      # when the drive is built in the same run (first use of a key) and fails
      # when a previous run's drive comes back. devsetup recreates the .env and
      # the drive, so only the download is worth keeping.
      - name: Resolve the @sasjs/server release
        id: server-release
        run: |
          TAG=$(curl -sI https://github.com/sasjs/server/releases/latest \
            | grep -i '^location:' | sed 's#.*/tag/##' | tr -d '\r')
          # no tag means no answer (an outage, a rate limit): a unique key makes
          # the cache miss and the binary download fresh, which is safe
          [ -n "$TAG" ] || TAG="unknown-$(date +%s)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest @sasjs/server release: $TAG"

      - name: Cache SASjs Server binary
        id: cache-server
        uses: actions/cache@v4
        with:
          path: tools/sasjs-server/api-linux
          # `-bin` so this never restores the older cache entry, which was
          # archived from the whole folder and would unpack a second
          # tools/sasjs-server inside api-linux
          key: ${{ runner.os }}-sasjs-server-bin-${{ steps.server-release.outputs.tag }}

      # the archive keeps file modes, but a miss-then-hit on a different runner
      # image is not worth a mystery: make it executable either way
      - name: Make the server binary executable
        run: chmod +x tools/sasjs-server/api-linux 2>/dev/null || true

      - name: Start local @sasjs/server + deploy app & mocks
        run: |
          npm run devsetup
          curl -sS -o /dev/null -w "server: %{http_code}\n" http://localhost:5000/SASjsApi/info
          curl -sS http://localhost:5000/AppStream/MacroDash/ | grep -o 'configured="[^"]*"'

      # Configure the backend before the e2e suite (via the CLI/adapter,
      # same path the frontend uses).  The board/DNF tests assume a
      # configured server; the configure service also stamps the served
      # index.html as configured="true" so the game registers a backend.
      - name: Configure the local backend
        run: |
          ROOTDIR="${GITHUB_WORKSPACE}/tools/sasjs-server/sasjs_root/rootdir"
          echo "{\"config\":[{\"rootdir\":\"${ROOTDIR}\"}]}" > /tmp/cfg.json
          npx sasjs request "services/common/configure" --data /tmp/cfg.json -t local 2>&1
          curl -sS http://localhost:5000/AppStream/MacroDash/ | grep -o 'configured="[^"]*"'

      - name: Run browser e2e suite
        run: npm run test:e2e

  pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # pick up package.json version bumped by the release job, so the
          # injected {{VERSION}} on the homepage matches the released version
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # inject version number into homepage (replace every {{VERSION}} placeholder)
      - name: Inject version
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const version = pkg.version;
          const indexPath = 'src/index.html';
          let html = fs.readFileSync(indexPath,'utf8');
          html = html.replaceAll('{{VERSION}}', version);
          fs.writeFileSync(indexPath, html);
          EOF
      # disable Jekyll processing on GitHub Pages
      - name: Add .nojekyll
        run: touch src/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4

  build:
    name: Build artefacts (sasjs cb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # compile + build the deployable artefacts locally, per platform.
      # No deploy: `cb` only compiles/builds to sasjsbuild/.  The viya
      # and server targets just select the config; nothing reaches a server.
      - name: Build Viya artefact
        run: |
          npx sasjs cb -t viya
          mkdir -p artefacts
          cp sasjsbuild/viya.sas artefacts/macro-dash-viya.sas
          cp sasjsbuild/viya.json.zip artefacts/macro-dash-viya.json.zip

      - name: Build Server artefact
        run: |
          npx sasjs cb -t server
          mkdir -p artefacts
          cp sasjsbuild/server.json.zip artefacts/macro-dash-server.json.zip

      - name: Verify build artefacts
        run: |
          ls -lh artefacts
          test -s artefacts/macro-dash-viya.sas
          test -s artefacts/macro-dash-server.json.zip

      # persist the artefacts for the release job
      - uses: actions/upload-artifact@v4
        with:
          name: macro-dash-artefacts
          path: artefacts/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # semantic-release writes the version/CHANGELOG back to the repo,
    # creates a tag, and publishes a release - needs write on contents.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # restore the artefacts built by the build job
      - uses: actions/download-artifact@v4
        with:
          name: macro-dash-artefacts
          path: artefacts

      # semantic-release finds its config with cosmiconfig, which reads a
      # "release" key in package.json BEFORE .releaserc.json.  A key there
      # replaces the whole plugin list, so the default plugins publish the
      # release with no artefacts attached and every
      # releases/latest/download/<file> URL answers 404.
      - name: Check the release config is not shadowed
        run: |
          node -e "const p=require('./package.json'); if (p.release) { console.error('package.json carries a \"release\" key, which shadows .releaserc.json - the release would publish with no artefacts. Delete the key; the release config lives in .releaserc.json.'); process.exit(1) }"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
