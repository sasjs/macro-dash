name: CI – Test → Build → Release → Pages

# Fully self-contained pipeline: runs entirely on the runner, builds the
# deployable artefacts with `sasjs cb` (no deploy step, no SAS/Viya
# server push), and tests the game in a real browser (headless chromium)
# against its own mocked build - a static site whose service worker answers
# /SASjsApi/* from @sasjs/api.  No SAS, no @sasjs/server, no devsetup.
# semantic-release runs before GitHub Pages so the homepage version matches
# the release.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # needed for the release job (semantic-release writes a release + tags)

concurrency:
  group: ci-macro-dash
  cancel-in-progress: true

jobs:
  test:
    name: Tests (browser automation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # .npmrc carries ignore-scripts=true, so the adapter bundle is copied by
      # its own step rather than by the prepare script - and the dependency
      # gate runs on every build, refusing any advisory above the floor that is
      # not in scripts/audit-allowlist.json with a reason.
      - run: npm ci

      - name: Copy the adapter bundle (src/sasjs.js is gitignored)
        run: npm run adapter

      - name: Dependency audit gate
        run: npm run audit:gate

      # physics / level sanity gate
      - run: npm test

      # headless chromium for the Playwright suite.  Use the bundled
      # chromium (installed with --with-deps so shared libs are present)
      # - the documented, reliable path.
      - name: Install chromium (Playwright)
        # `--with-deps` installs system packages BEFORE it downloads the browser,
        # so the runner's apt mirror is a dependency of this job. A resolver
        # failure there ("Temporary failure resolving 'azure.archive.ubuntu.com'",
        # 2026-11-11) failed this step, skipped the suite and blocked the release,
        # for a reason no commit can affect and a re-run cannot fix while the
        # mirror is unreachable.
        #
        # The system packages are therefore best-effort and the browser is not;
        # the launch check below is what decides whether the image genuinely had
        # what Chromium needs.
        run: |
          npx playwright install --with-deps chromium ||
            npx playwright install chromium

      - name: Check chromium launches
        # Reading the install's exit code is not enough: a browser that installed
        # but cannot start fails every spec in the suite with a timeout, instead
        # of naming the missing library here.
        run: |
          node -e "
            const { chromium } = require('playwright')
            chromium
              .launch()
              .then((browser) => browser.close())
              .then(() => console.log('chromium launches'))
              .catch((error) => {
                console.error(error)
                process.exit(1)
              })
          "

      # The mock target builds a static site from the same services, under the
      # CLI this repo pins: a bump that drops the browser build fails here
      # rather than at the next person who tries it.  The suite under test is
      # this folder - run.js serves it and stops there.  No @sasjs/server, no
      # devsetup, no SAS: a backend that needs a binary to answer is exactly
      # what the mocked build exists to avoid.
      - name: Build the mock site
        run: npm run mock:build

      # what the pages job publishes is this folder, so check it is a site and
      # not just a copy of src/: the worker and its host are the backend there
      - name: Check the mock site has its backend
        run: |
          test -s sasjsbuild/mock/sw.js
          test -s sasjsbuild/mock/host/boot.js
          test -s sasjsbuild/mock/host/api-browser.js
          grep -q 'configured=' sasjsbuild/mock/index.html
          echo "mock site: worker + host + page"

      - name: Run browser e2e suite
        run: npm run test:e2e

  pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # pick up package.json version bumped by the release job, so the
          # injected {{VERSION}} on the homepage matches the released version
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # inject version number into homepage (replace every {{VERSION}} placeholder)
      # before the build copies src/ into the published folder
      - name: Inject version
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const version = pkg.version;
          const indexPath = 'src/index.html';
          let html = fs.readFileSync(indexPath,'utf8');
          html = html.replaceAll('{{VERSION}}', version);
          fs.writeFileSync(indexPath, html);
          EOF
      # The published site is the *mocked* build, not src/: `sasjs build -t mock`
      # writes the same page plus host/ and sw.js, a service worker that answers
      # /SASjsApi/* from @sasjs/api.  A static host serves files only, so src/ on
      # its own has no backend and configure answers 405.
      - name: Build the mocked site
        run: npm run mock:build
      # The published folder is sasjsbuild/mock: the build copies src/ into it,
      # so the committed src/CNAME is the one place the domain is written.  Only
      # Jekyll's marker has to be added - src/ does not carry a hidden file.
      - name: Add .nojekyll
        run: touch sasjsbuild/mock/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sasjsbuild/mock
      - id: deployment
        uses: actions/deploy-pages@v4

  build:
    name: Build artefacts (sasjs cb)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # compile + build the deployable artefacts locally, per platform.
      # No deploy: `cb` only compiles/builds to sasjsbuild/.  The viya
      # and server targets just select the config; nothing reaches a server.
      - name: Build Viya artefact
        run: |
          npx sasjs cb -t viya
          mkdir -p artefacts
          cp sasjsbuild/viya.sas artefacts/macro-dash-viya.sas
          cp sasjsbuild/viya.json.zip artefacts/macro-dash-viya.json.zip

      - name: Build Server artefact
        run: |
          npx sasjs cb -t server
          mkdir -p artefacts
          cp sasjsbuild/server.json.zip artefacts/macro-dash-server.json.zip

      - name: Verify build artefacts
        run: |
          ls -lh artefacts
          test -s artefacts/macro-dash-viya.sas
          test -s artefacts/macro-dash-server.json.zip

      # persist the artefacts for the release job
      - uses: actions/upload-artifact@v4
        with:
          name: macro-dash-artefacts
          path: artefacts/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # semantic-release writes the version/CHANGELOG back to the repo,
    # creates a tag, and publishes a release - needs write on contents.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # restore the artefacts built by the build job
      - uses: actions/download-artifact@v4
        with:
          name: macro-dash-artefacts
          path: artefacts

      # semantic-release finds its config with cosmiconfig, which reads a
      # "release" key in package.json BEFORE .releaserc.json.  A key there
      # replaces the whole plugin list, so the default plugins publish the
      # release with no artefacts attached and every
      # releases/latest/download/<file> URL answers 404.
      - name: Check the release config is not shadowed
        run: |
          node -e "const p=require('./package.json'); if (p.release) { console.error('package.json carries a \"release\" key, which shadows .releaserc.json - the release would publish with no artefacts. Delete the key; the release config lives in .releaserc.json.'); process.exit(1) }"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
