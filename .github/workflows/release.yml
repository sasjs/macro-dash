name: Release

# scripts/release.mjs never writes to main. It works the next version out from
# the conventional commits merged since the last tag and opens a pull request
# with package.json and CHANGELOG.md bumped (--propose); when a person merges
# that pull request, the default mode tags the merged commit and publishes the
# release. This workflow then builds the deployable artefacts and attaches them,
# so releases/latest/download/<file> keeps answering.

on:
  push:
    branches: [main]
  # a manual run releases whatever has been merged since the last tag
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # the script tags, and reads the tags to find the last release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # tags and publishes the version the merged release PR states; a no-op on
      # any other push
      - name: Publish the release this commit describes
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs

      # and open (or refresh) the pull request for whatever has been merged
      # since - never a commit to main
      - name: Propose the next release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release.mjs --propose

  artefacts:
    name: Build the release artefacts
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/artefacts.yml

  attach:
    name: Attach the artefacts to the release
    needs: [release, artefacts]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.artefacts.outputs.artifact-name }}
          path: artefacts

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" artefacts/* --clobber
